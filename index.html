<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="朝ボード">
<title>朝ボード</title>
<style>
:root{color-scheme:light;--card:rgba(255,255,255,.93);--tx:#2b2a27;--tx2:#615f58;--tx3:#9b988e;--line:#efe8d8;--ac:#c2590a;--acbg:#ffe6bd}
*{box-sizing:border-box}
body{margin:0;background:#fff4dc linear-gradient(180deg,#bfe0f8 0%,#e9f2f6 28%,#fff1d4 62%,#ffe9c2 100%) fixed;color:var(--tx);font-family:-apple-system,"Hiragino Sans",sans-serif;padding:16px;min-height:100vh}
.grid{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.6fr);gap:14px;max-width:1180px;margin:0 auto}
.col{display:flex;flex-direction:column;gap:14px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px 20px}
.lbl{font-size:13px;color:var(--tx2);display:flex;justify-content:space-between;gap:8px}
#clock{font-size:76px;font-weight:500;line-height:1.05;font-variant-numeric:tabular-nums}
#clock small{font-size:28px;color:var(--tx3)}
#date{font-size:18px;color:var(--tx2)}
.wx{display:flex;align-items:center;gap:14px;margin-top:6px}
.wx .t{font-size:44px;font-weight:500}
.wx .s{font-size:15px;color:var(--tx2)}
.hrs{display:flex;justify-content:space-between;margin-top:12px;font-size:13px;color:var(--tx2)}
.hrs b{display:block;color:var(--tx);font-weight:500;font-size:16px}
table{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums}
th{font-size:12px;color:var(--tx3);font-weight:400;text-align:left;padding:6px;border-bottom:1px solid var(--line)}
td{font-size:21px;padding:11px 6px;border-bottom:1px solid var(--line)}
tr.past td{color:var(--tx3)}
tr.next td{background:var(--acbg);font-weight:500}
td.r,th.r{text-align:right}
.big{font-size:38px;font-weight:500;margin:8px 0 10px}
.note{font-size:12px;color:var(--tx3);margin-top:10px;line-height:1.6}
iframe{border:0;width:100%;height:300px;border-radius:8px}
button{font:inherit;font-size:14px;padding:8px 16px;border-radius:8px;border:1px solid var(--line);background:var(--card);color:var(--tx2)}
#ph{position:relative;aspect-ratio:4/3;border-radius:10px;overflow:hidden;background:#f3ead7}
#ph img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;opacity:0;transition:opacity 1.2s}
#ph img.on{opacity:1}
#phEmpty{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;text-align:center;padding:16px;font-size:14px;color:var(--tx2)}
#phBar{display:flex;align-items:center;gap:10px;margin-top:8px;font-size:13px;color:var(--tx2)}
#phBar span{flex:1}
@media (max-width:820px){.grid{grid-template-columns:1fr}}
</style>
</head>
<body>
<div class="grid">
 <div class="col">
  <div class="card"><div id="date"></div><div id="clock"></div></div>
  <div class="card">
   <div class="lbl"><span>今日の天気(降水確率)</span><span id="wxupd"></span></div>
   <div class="wx"><div class="t" id="wxt">--</div><div class="s" id="wxs">読み込み中…</div></div>
   <div class="hrs" id="wxh"></div>
  </div>
  <div class="card">
   <div class="lbl"><span>今日の予定</span></div>
   <div id="cal"></div>
  </div>
  <div class="card" style="padding:10px">
   <div id="ph"><img id="p1" alt=""><img id="p2" alt=""><div id="phEmpty">写真を選ぶと、ここでスライドショーが始まります</div></div>
   <div id="phBar"><input type="file" id="phIn" accept="image/*" multiple hidden><button id="phAdd">写真を選ぶ</button><span id="phCount"></span><button id="phClear">すべて削除</button></div>
   <div class="note" style="margin:6px 4px 2px">写真はこのiPadの中だけに保存され、公開されません。</div>
  </div>
 </div>
 <div class="col">
  <div class="card">
   <div class="lbl"><span>東浦和 → 南浦和 → 赤羽 → 赤羽西六丁目(バス)</span><span id="daytype"></span></div>
   <div id="route"></div>
   <div class="note">乗り換えは南浦和・赤羽とも3分で計算。バスは赤羽駅西口発の赤53(ときわ台駅行き)。時刻は2026年11月時点の時刻表をもとにしています。遅延は反映されません。</div>
  </div>
 </div>
</div>

:23"], ["09:28", "09:32"], ["09:36", "09:40"], ["09:43", "09:48"], ["09:50", "09:55"], ["09:57", "10:02"]], "keihin": [["04:30", "04:42"], ["04:40", "04:52"], ["04:49", "05:02"], ["05:00", "05:12"], ["05:11", "05:23"], ["05:28", "05:40"], ["05:33", "05:45"], ["05:40", "05:52"], ["05:49", "06:01"], ["05:58", "06:10"], ["06:11", "06:23"], ["06:16", "06:28"], ["06:23", "06:35"], ["06:27", "06:40"], ["06:33", "06:45"], ["06:38", "06:50"], ["06:44", "06:56"], ["06:50", "07:03"], ["06:56", "07:08"], ["07:04", "07:18"], ["07:11", "07:23"], ["07:15", "07:28"], ["07:21", "07:33"], ["07:25", "07:37"], ["07:31", "07:43"], ["07:36", "07:48"], ["07:41", "07:53"], ["07:46", "07:58"], ["07:51", "08:03"], ["07:56", "08:08"], ["08:01", "08:13"], ["08:06", "08:18"], ["08:11", "08:23"], ["08:16", "08:28"], ["08:21", "08:33"], ["08:26", "08:38"], ["08:31", "08:43"], ["08:37", "08:49"], ["08:41", "08:53"], ["08:46", "08:58"], ["08:51", "09:03"], ["08:56", "09:08"], ["09:01", "09:13"], ["09:06", "09:18"], ["09:11", "09:23"], ["09:16", "09:28"], ["09:21", "09:33"], ["09:26", "09:38"], ["09:31", "09:43"], ["09:36", "09:48"], ["09:41", "09:53"], ["09:46", "09:58"], ["09:51", "10:03"], ["09:56", "10:09"], ["10:01", "10:14"], ["10:06", "10:18"], ["10:11", "10:23"], ["10:16", "10:28"], ["10:21", "10:33"], ["10:26", "10:38"], ["10:31", "10:43"], ["10:36", "10:48"], ["10:41", "10:53"], ["10:46", "10:58"], ["10:51", "11:03"], ["10:56", "11:08"]], "bus": [["06:20", "06:24"], ["06:40", "06:44"], ["07:00", "07:04"], ["07:15", "07:19"], ["07:27", "07:31"], ["07:39", "07:44"], ["07:51", "07:56"], ["08:02", "08:07"], ["08:13", "08:18"], ["08:23", "08:28"], ["08:31", "08:36"], ["08:39", "08:44"], ["08:47", "08:52"], ["08:55", "09:00"], ["09:03", "09:08"], ["09:11", "09:16"], ["09:19", "09:24"], ["09:27", "09:32"], ["09:35", "09:40"], ["09:43", "09:48"], ["09:51", "09:56"]]}};
const CALENDAR_EMBED_URL="";
const LAT=35.8077,LON=139.7242;
const WALK=3,SHOW_FROM="04:30",SHOW_UNTIL="09:00";
const m=s=>{const p=s.split(":");return +p[0]*60+ +p[1]};
const pad=n=>String(n).padStart(2,"0");
const f=n=>pad(Math.floor(n/60))+":"+pad(n%60);
const ymd=d=>d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate());
let holidays={},showAll=false;
function dayKind(d){const w=d.getDay();return (w===0||w===6||holidays[ymd(d)])?"holiday":"weekday"}
function build(kind){
  const D=DATA[kind],rows=[];
  for(const [a,b] of D.musashino){
    const dep=m(a),arr=m(b);
    if(dep<m(SHOW_FROM)||dep>m(SHOW_UNTIL)) continue;
    const k=D.keihin.find(x=>m(x[0])>=arr+WALK); if(!k) continue;
    const ak=m(k[1]);
    const bus=D.bus.find(x=>m(x[0])>=ak+WALK); if(!bus) continue;
    rows.push({dep:dep,mArr:arr,kDep:m(k[0]),ak:ak,bDep:m(bus[0]),bArr:m(bus[1]),tot:m(bus[1])-dep});
  }
  return rows;
}
function render(){
  const now=new Date(),nm=now.getHours()*60+now.getMinutes();
  document.getElementById("date").textContent=now.toLocaleDateString("ja-JP",{month:"long",day:"numeric",weekday:"short"});
  document.getElementById("clock").innerHTML=pad(now.getHours())+":"+pad(now.getMinutes())+"<small> :"+pad(now.getSeconds())+"</small>";
  const kind=dayKind(now);
  document.getElementById("daytype").textContent=kind==="weekday"?"平日ダイヤ":"土休日ダイヤ";
  const rows=build(kind),el=document.getElementById("route");
  if(nm>m(SHOW_UNTIL)&&!showAll){
    el.innerHTML='<div class="big">朝の通勤時間は終了</div><button onclick="showAll=true;render()">時刻表を見る</button>';
  }else if(nm<m(SHOW_FROM)&&!showAll){
    el.innerHTML='<div class="big">始発は '+f(rows[0].dep)+' 東浦和発</div><button onclick="showAll=true;render()">時刻表を見る</button>';
  }else{
    const nextIdx=rows.findIndex(r=>r.dep>=nm);
    let h='<table><tr><th>東浦和発</th><th>南浦和 着→発</th><th>赤羽 着</th><th>バス 発→着</th><th class="r">合計</th></tr>';
    rows.forEach((r,i)=>{
      let cls=i===nextIdx?"next":"";
      if(!showAll&&nextIdx>=0&&i<nextIdx){ if(i<nextIdx-1) return; cls="past"; }
      h+='<tr class="'+cls+'"><td>'+f(r.dep)+(i===nextIdx?' <span style="font-size:13px">あと'+(r.dep-nm)+'分</span>':'')+'</td><td>'+f(r.mArr)+'→'+f(r.kDep)+'</td><td>'+f(r.ak)+'</td><td>'+f(r.bDep)+'→'+f(r.bArr)+'</td><td class="r">'+r.tot+'分</td></tr>';
    });
    h+='</table>';
    if(showAll) h+='<div style="margin-top:10px"><button onclick="showAll=false;render()">閉じる</button></div>';
    el.innerHTML=h;
  }
}
async function weather(){
  try{
    const ctl=new AbortController();setTimeout(function(){ctl.abort()},10000);
    const j=await (await fetch("https://www.jma.go.jp/bosai/forecast/data/forecast/110000.json",{signal:ctl.signal})).json();
    const ts=j[0].timeSeries;
    const a0=ts[0].areas.find(function(a){return a.area.code==="110010"});
    const a1=ts[1].areas.find(function(a){return a.area.code==="110010"});
    const a2=ts[2].areas.find(function(a){return a.area.code==="43241"})||ts[2].areas[0];
    const today=ymd(new Date());
    let mx="--",mn="--";
    ts[2].timeDefines.forEach(function(d,i){
      if(d.slice(0,10)!==today) return;
      if(d.slice(11,13)==="09") mx=a2.temps[i]; else if(d.slice(11,13)==="00") mn=a2.temps[i];
    });
    document.getElementById("wxt").textContent=mx+"°C";
    document.getElementById("wxs").innerHTML=a0.weathers[0].replace(/　/g," ")+"<br>最高気温"+mx+"° / 最低"+mn+"°";
    let h="";
    ts[1].timeDefines.forEach(function(d,i){
      if(d.slice(0,10)!==today) return;
      const hr=+d.slice(11,13);
      h+='<span><b>'+a1.pops[i]+'%</b>'+hr+'時〜'+(hr+6)+'時</span>';
    });
    document.getElementById("wxh").innerHTML=h;
    document.getElementById("wxupd").textContent="埼玉県南部・気象庁 "+pad(new Date().getHours())+":"+pad(new Date().getMinutes())+" 更新";
  }catch(e){document.getElementById("wxs").textContent="天気を取得できませんでした"}
}
function calendar(){
  const c=document.getElementById("cal");
  let u="";
  try{u=localStorage.getItem("calUrl")||""}catch(e){}
  if(u.indexOf("https://calendar.google.com/")===0){
    c.innerHTML='<iframe></iframe><div style="margin-top:8px"><button id="calReset">カレンダーURLを変更</button></div>';
    c.querySelector("iframe").src=u;
    document.getElementById("calReset").onclick=function(){try{localStorage.removeItem("calUrl")}catch(e){} calendar()};
  }else{
    c.innerHTML='<div class="note" style="margin:0 0 8px">GoogleカレンダーのURLを貼り付けると、このiPadだけに保存して予定を表示します。</div><input id="calIn" placeholder="https://calendar.google.com/calendar/embed?..." style="width:100%;font-size:14px;padding:8px;border:1px solid var(--line);border-radius:8px;margin-bottom:8px"><button id="calSave">保存して表示</button><div id="calErr" class="note"></div>';
    document.getElementById("calSave").onclick=function(){
      const v=document.getElementById("calIn").value;
      const mt=v.match(/https:\/\/calendar\.google\.com\/calendar\/[^"'\s<>]+/);
      if(!mt){document.getElementById("calErr").textContent="Googleカレンダーの埋め込みURLを貼り付けてください。";return}
      try{localStorage.setItem("calUrl",mt[0].replace(/&amp;/g,"&"))}catch(e){document.getElementById("calErr").textContent="保存できませんでした。";return}
      calendar();
    };
  }
}
const PH_MS=9000;
let phList=[],phIdx=-1,phTimer=null,phFront=1,phUrls={p1:null,p2:null};
function phDb(){return new Promise(function(res,rej){const r=indexedDB.open("asaboard",1);r.onupgradeneeded=function(){r.result.createObjectStore("photos",{autoIncrement:true})};r.onsuccess=function(){res(r.result)};r.onerror=function(){rej(r.error)}})}
function phReq(mode,fn){return phDb().then(function(db){return new Promise(function(res,rej){const tx=db.transaction("photos",mode);const rq=fn(tx.objectStore("photos"));tx.oncomplete=function(){res(rq&&rq.result)};tx.onerror=function(){rej(tx.error)}})})}
async function phShrink(file){
  let bmp;try{bmp=await createImageBitmap(file)}catch(e){return null}
  const s=Math.min(1,1600/Math.max(bmp.width,bmp.height));
  const c=document.createElement("canvas");c.width=Math.round(bmp.width*s);c.height=Math.round(bmp.height*s);
  c.getContext("2d").drawImage(bmp,0,0,c.width,c.height);
  return new Promise(function(res){c.toBlob(res,"image/jpeg",0.85)});
}
function phShuffle(a){for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));const t=a[i];a[i]=a[j];a[j]=t}return a}
function phShow(){
  if(!phList.length) return;
  phIdx=(phIdx+1)%phList.length;
  const nxt=phFront===1?"p2":"p1",cur=phFront===1?"p1":"p2";
  const el=document.getElementById(nxt);
  if(phUrls[nxt]) URL.revokeObjectURL(phUrls[nxt]);
  phUrls[nxt]=URL.createObjectURL(phList[phIdx]);
  el.src=phUrls[nxt];
  el.onload=function(){el.classList.add("on");document.getElementById(cur).classList.remove("on")};
  phFront=phFront===1?2:1;
}
async function phLoad(){
  try{
    const arr=await phReq("readonly",function(s){return s.getAll()});
    phList=phShuffle(arr||[]);
  }catch(e){phList=[]}
  document.getElementById("phCount").textContent=phList.length?phList.length+"枚":"";
  document.getElementById("phEmpty").style.display=phList.length?"none":"flex";
  clearInterval(phTimer);phIdx=-1;
  ["p1","p2"].forEach(function(id){document.getElementById(id).classList.remove("on")});
  phFront=1;
  if(phList.length){phShow();if(phList.length>1) phTimer=setInterval(phShow,PH_MS)}
}
function photos(){
  const inp=document.getElementById("phIn"),cnt=document.getElementById("phCount");
  document.getElementById("phAdd").onclick=function(){inp.click()};
  inp.onchange=async function(){
    const files=Array.from(inp.files);let n=0;
    for(let i=0;i<files.length;i++){
      cnt.textContent="保存中 "+(i+1)+"/"+files.length;
      const b=await phShrink(files[i]);
      if(b){try{await phReq("readwrite",function(s){return s.add(b)});n++}catch(e){cnt.textContent="保存できませんでした";break}}
    }
    inp.value="";
    await phLoad();
  };
  document.getElementById("phClear").onclick=async function(){
    if(!confirm("保存した写真をすべて削除しますか？")) return;
    try{await phReq("readwrite",function(s){return s.clear()})}catch(e){}
    await phLoad();
  };
  phLoad();
